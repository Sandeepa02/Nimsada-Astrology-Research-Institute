<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>මුරපදය නැවත සකසන්න</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="auth-logo" aria-label="මුල් පිටුවට">ඉම්සද</a>
        <h1 class="auth-title">මුරපදය අමතකද?</h1>
        <p class="auth-subtitle">ඔබගේ විද්‍යුත් තැපෑල ඇතුළත් කරන්න</p>
      </div>
      <div id="auth-alert" class="auth-alert" role="alert"></div>
      <form id="forgot-password-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="forgot-email" class="form-label">විද්‍යුත් තැපෑල</label>
          <input type="email" id="forgot-email" class="form-input" required autocomplete="email">
          <span class="field-error-msg">වලංගු විද්‍යුත් තැපැල් ලිපිනයක් ඇතුළත් කරන්න.</span>
        </div>
        <button type="submit" class="btn btn-gold w-100">නැවත සකස් කිරීමේ උපදෙස් යවන්න</button>
      </form>
      <div class="auth-footer"><a href="login.html">පිවිසුම් පිටුවට ආපසු යන්න</a></div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
