<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>පරිශීලක පිවිසුම | ඉම්සද ජ්යෝතිර්විද්යා පර්යේෂණ ආයතනය</title>
  
  <meta name="description" content="ඉම්සද ජ්යෝතිර්විද්යා පර්යේෂණ ආයතනය - පරිශීලක පිවිසුම">
  <meta name="theme-color" content="#060919">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-page">

  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>
  <canvas id="star-canvas" class="star-canvas" aria-hidden="true"></canvas>

  <div class="auth-container">
    <div class="auth-card">
      
      <div class="auth-header">
        <a href="../index.html" class="auth-logo" aria-label="මුල් පිටුවට">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="22" stroke="url(#goldGradAuth)" stroke-width="1.5" stroke-dasharray="3 3"/>
            <circle cx="24" cy="24" r="17" stroke="url(#goldGradAuth)" stroke-width="1"/>
            <path d="M24 6L26.8 19.5L38 14L28.5 24L38 34L26.8 28.5L24 42L21.2 28.5L10 34L19.5 24L10 14L21.2 19.5L24 6Z" fill="url(#goldGradAuth)" opacity="0.85"/>
            <circle cx="24" cy="24" r="4.5" fill="#f8e7a2"/>
            <defs>
              <linearGradient id="goldGradAuth" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f5e197"/>
                <stop offset="50%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#aa811a"/>
              </linearGradient>
            </defs>
          </svg>
        </a>
        <h1 class="auth-title">පරිශීලක පිවිසුම</h1>
        <p class="auth-subtitle">ඉම්සද ජ්යෝතිර්විද්යා පර්යේෂණ ආයතනය</p>
      </div>

      <!-- Alert Message -->
      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <!-- User Login Form -->
      <form id="user-login-form" class="auth-form" novalidate>
        
        <div class="form-group">
          <label for="login-email" class="form-label">
            විද්‍යුත් තැපෑල <span class="required-star">*</span>
          </label>
          <div class="input-wrap">
            <input type="email" id="login-email" class="form-input" placeholder="user@imsada.lk" required autocomplete="email" value="user@imsada.lk">
          </div>
          <span class="field-error-msg">වලංගු විද්‍යුත් තැපැල් ලිපිනයක් ඇතුළත් කරන්න.</span>
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">
            මුරපදය <span class="required-star">*</span>
          </label>
          <div class="input-wrap has-icon">
            <input type="password" id="login-password" class="form-input" placeholder="ඔබගේ මුරපදය" required autocomplete="current-password" value="demo1234">
            <button type="button" class="toggle-password-btn" aria-label="මුරපදය පෙන්වන්න/සඟවන්න">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="field-error-msg">කරුණාකර මුරපදය ඇතුළත් කරන්න (අවම අකුරු 4).</span>
        </div>

        <div class="auth-options">
          <span></span>
          <a href="forgot-password.html" class="auth-link">මුරපදය මතක නැද්ද?</a>
        </div>

        <button type="submit" class="btn btn-gold w-100" style="padding: 13px;">
          <span>පිවිසෙන්න</span>
          <svg viewBox="0 0 20 20" fill="currentColor" class="btn-arrow">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>

      </form>

      <div class="auth-footer">
        ගිණුමක් නොමැතිද? <a href="register.html">ලියාපදිංචි වන්න</a>
        <br>
        <a href="../index.html" class="back-home-link">← මුල් පිටුවට ආපසු යන්න</a>
      </div>

    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
